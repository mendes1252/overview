<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none" role="img" aria-label="Vistoria Aí">
  <!-- "vistoria" text in white -->
  <text x="0" y="52" font-family="DM Sans, system-ui, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-1">vist</text>
  <!-- Hard hat replacing the "o" -->
  <g transform="translate(97, 8)">
    <!-- Hat brim -->
    <rect x="-4" y="30" width="42" height="6" rx="3" fill="#dba914"/>
    <!-- Hat dome -->
    <path d="M2 30 C2 14 32 14 32 30Z" fill="#dba914"/>
    <!-- Hat band highlight -->
    <rect x="2" y="24" width="30" height="4" rx="2" fill="#b8900f" opacity="0.5"/>
    <!-- Ventilation dot -->
    <circle cx="17" cy="16" r="3" fill="#b8900f"/>
  </g>
  <!-- "ria" continuing after the hard hat -->
  <text x="144" y="52" font-family="DM Sans, system-ui, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-1">ria</text>
  <!-- Gold rectangle with "Aí" -->
  <rect x="228" y="6" width="92" height="54" rx="6" fill="#dba914"/>
  <text x="274" y="46" font-family="DM Sans, system-ui, sans-serif" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Aí</text>
</svg>
